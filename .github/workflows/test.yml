name: CI/CD Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: urlshortener_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Tests/requirements.txt

      - name: Restore .NET dependencies
        run: dotnet restore UrlShortener.Api.csproj

      - name: Build backend
        run: dotnet build UrlShortener.Api.csproj --no-restore --configuration Release

      - name: Verify PostgreSQL is ready
        run: |
          echo "Checking PostgreSQL connection..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "✓ PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          psql -h localhost -U postgres -d urlshortener_test -c "SELECT version();" || echo "Could not connect to database"
        env:
          PGPASSWORD: test_password

      - name: Install EF Core tools
        run: |
          dotnet tool install --global dotnet-ef || dotnet tool update --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Run database migrations
        run: |
          echo "Running EF Core migrations..."
          dotnet ef database update --project UrlShortener.Api.csproj --verbose
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=urlshortener_test;Username=postgres;Password=test_password"
          Jwt__Key: "test-jwt-key-for-github-actions-minimum-32-characters-long"
          Jwt__Issuer: "UrlShortener"
          Jwt__Audience: "UrlShortenerUsers"

      - name: Start API in background
        run: |
          nohup dotnet run --project UrlShortener.Api.csproj --no-build --configuration Release > api.log 2>&1 &
          echo $! > api.pid
          echo "API started with PID $(cat api.pid)"
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=urlshortener_test;Username=postgres;Password=test_password"
          Jwt__Key: "test-jwt-key-for-github-actions-minimum-32-characters-long"
          Jwt__Issuer: "UrlShortener"
          Jwt__Audience: "UrlShortenerUsers"
          ASPNETCORE_URLS: "http://localhost:5000"
          ASPNETCORE_ENVIRONMENT: "Development"

      - name: Wait for API to start
        run: |
          echo "Waiting for API to start..."
          for i in {1..60}; do
            if curl -f -s http://localhost:5000/api/links > /dev/null 2>&1; then
              echo "✓ API is up and responding!"
              exit 0
            elif [ $? -eq 22 ]; then
              echo "✓ API is up (401 Unauthorized - expected without token)!"
              exit 0
            fi
            echo "Attempt $i/60: API not ready yet..."
            sleep 3
          done
          echo "✗ API failed to start after 3 minutes"
          echo "--- API Logs ---"
          cat api.log || echo "No log file found"
          exit 1

      - name: Check API health
        if: success()
        run: |
          echo "Testing API endpoints..."
          curl -v http://localhost:5000/api/links 2>&1 || true
          echo "--- Recent API Logs ---"
          tail -n 50 api.log || echo "No log file"

      - name: Generate test data
        run: python Tests/generate_test_data.py
        env:
          DATABASE_URL: "host=localhost port=5432 dbname=urlshortener_test user=postgres password=test_password"

      - name: Run integration tests
        run: python Tests/run_integration_tests.py
        env:
          API_BASE_URL: "http://localhost:5000"

      - name: Show API logs on failure
        if: failure()
        run: |
          echo "=== API Logs ==="
          cat api.log || echo "No log file found"

      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            echo "Stopping API (PID: $(cat api.pid))"
            kill $(cat api.pid) || true
            sleep 2
            kill -9 $(cat api.pid) 2>/dev/null || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            Tests/results/
            api.log

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        run: docker build -t urlshortener-api:test .

      - name: Build Frontend Docker image
        run: docker build -t urlshortener-frontend:test ./Front

      - name: Test Docker Compose
        run: |
          docker compose up -d
          sleep 30
          docker compose ps
          curl -f http://localhost:5000/api/links || echo "API check failed"
          curl -f http://localhost:3000 || echo "Frontend check failed"
          docker compose logs
          docker compose down
        env:
          DB_PASSWORD: test_password
          JWT_KEY: test-jwt-key-for-github-actions-minimum-32-characters-long
          DOMAIN_NAME: localhost

